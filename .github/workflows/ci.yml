name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --prefix .host --no-audit --no-fund @deepseek-ai/dsh@0.1.7-rc.2
      - name: Set host package path
        shell: bash
        run: echo "DSH_HOST_NODE_MODULES=$GITHUB_WORKSPACE/.host/node_modules" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm pack --dry-run
